apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-2-1b-instruct
spec:
  predictor:
    minReplicas: 1  # scale-to-zero activé
    maxReplicas: 1
    annotations:
      serving.knative.dev/progress-deadline: "1800s"
    containers:
      - name: vllm
        image: emericocto/vllm-cpu:2.0
        command: ["/bin/sh", "-c"]
        args: ["sleep infinity"]

        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
          limits:
            memory: "16Gi"
            cpu: "4"


        # args: [
        #   "vllm serve meta-llama/Llama-3.2-1B-Instruct --device cpu --port 8080 --host 0.0.0.0"
        # ]
        env:
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token-secret
                key: token
          - name: VLLM_TARGET_DEVICE
            value: "cpu"
          - name: VLLM_CPU_AVX512BF16
            value: "1"
          - name: VLLM_RPC_TIMEOUT
            value: "100000"
          - name: XDG_CONFIG_HOME
            value: "/tmp/config"
        ports:
          - containerPort: 8080
        # volumeMounts:
        #   - name: cache-volume
        #     mountPath: /root/.cache/huggingface
    # volumes:
    #   - name: cache-volume
    #     persistentVolumeClaim:
    #       claimName: vllm-models
